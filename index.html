<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenLens: free photo editor that never uploads your file</title>
    <meta
      name="description"
      content="Cut out a background, add halftone dots, curve text round an arc, add a watermark. Twenty-five free photo tools that run in your browser, so your photo is never uploaded."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f11" />

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenLens: free photo editor that never uploads your file" />
    <meta
      property="og:description"
      content="Cut out a background, add halftone dots, curve text round an arc. Twenty-five free photo tools, and your photo never leaves your device."
    />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The hero photograph is the largest contentful paint, so it is asked for
      before the parser reaches the body. It lives in `public/` rather than
      being imported precisely so this URL can be written by hand here; the
      component reads the same path, so the browser fetches it once.
    -->
    <link rel="preload" as="image" href="./landing/hero.jpg" fetchpriority="high" />

    <script>
      // Marks that scripting is available, before first paint. The reveal
      // animations hide their targets only when this class is present, so a
      // visitor without JavaScript gets the whole page, fully visible, rather
      // than a page of invisible sections.
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      OpenLens is a photo editor that runs in your browser, so it needs JavaScript turned on. Every
      edit happens on your own device, which is why your photo is never uploaded.
    </noscript>
    <script type="module" src="/src/landing/main-landing.js"></script>
  </body>
</html>
